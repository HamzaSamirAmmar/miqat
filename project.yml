name: Miqat
options:
  bundleIdPrefix: personal.hamza
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: "NO"

packages:
  Adhan:
    github: batoulapps/adhan-swift
    from: 1.5.0

targets:
  Miqat:
    type: application
    platform: macOS
    sources:
      - path: Miqat/Sources
    dependencies:
      - package: Adhan
    info:
      path: Miqat/Info.plist
      properties:
        CFBundleDisplayName: Miqat
        CFBundleShortVersionString: "1.0.0"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSLocationWhenInUseUsageDescription: >-
          Miqat uses your location once to calculate prayer times for where you
          are. Your location never leaves your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.hamza.miqat
        PRODUCT_NAME: Miqat
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  MiqatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MiqatTests
    dependencies:
      - target: Miqat

schemes:
  Miqat:
    build:
      targets:
        Miqat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiqatTests
